[project]
name = "pulsewatch-backend"
version = "0.1.0"
description = "API y worker de PulseWatch"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# E/F: errores y fallos básicos, I: orden de imports, B: errores probables,
# UP: sintaxis moderna de Python.
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Permite escribir "from app.main import app" en las pruebas.
pythonpath = ["."]
